<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Pattern Simulator | サブスク編</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/subscription.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Kosugi+Maru&display=swap" rel="stylesheet">
</head>
<body class="scenario-page subscription-page">
  <div class="branch-shell">
    <header class="scenario-header">
      <h1>サブスクリプション編</h1>
      <a class="scenario-home-link" href="../index.html">トップページへ</a>
    </header>
    <section class="panel branch-panel">
      <div class="branch-layout">
        <div class="branch-left">
          <div class="branch-card subscription-options" id="subscriptionOptions"></div>
        </div>
        <div class="branch-center"><div class="branch-preview subscription-preview" id="branchPreview" aria-label="サブスクサービスのプレビュー"></div></div>
        <div class="branch-right"><button type="button" class="screen-switch-button" id="screenToggleButton">解約画面の設定へ</button><div class="branch-score"><div class="branch-metrics-content"><h3>スコア予測</h3><div class="branch-chart" id="branchChart"></div><button type="button" class="finish-button" id="finishMetricsButton" disabled>完成</button></div></div></div>
      </div>
    </section>
  </div>
  <div class="overlay hidden" id="metricsOverlay"><div class="modal-card result-modal"><div class="metric-modal-head"><h3>Result</h3><button type="button" class="button secondary" id="closeMetricsButton">閉じる</button></div><div id="metricsPopupContent"></div></div></div>
  <script src="../js/subscription.js"></script>
</body>
</html>
